# ci - this repo's own checks, not vendored from cicd. The vendored go-binaries
# pipeline already runs go vet and go test -race; this adds what only this repo has:
#   - lint: gofmt, go vet and golangci-lint (make lint), and the lab module (make lab-test).
#   - docs: make docs must leave the tree unchanged, so enums_gen.go, docs/tools.md and
#     docs/tools.json match the catalog and the server.
#   - e2e: the built binary over stdio against lab/hvfixture (make e2e). The results
#     carry fresh markers and timings each run, so they are uploaded, not compared.
#   - evals: every answer in docs/evals/evals.xml through the tools (make evals).
#   - govulncheck: both modules. It fails only on a vulnerability the code can reach;
#     GO-2026-6094 in cel-go, pinned by health-validation and never called here, is
#     listed and does not fail it (README, "Scans").
# Trivy (image and dependencies) runs in docker.yml, OSV in security.yml.
#
# Kill switch: CI_ENABLED=false in .github/cicd/config.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Reads this repo's settings from the BASE of a PR (or the pushed commit), never
  # from the PR's own head, so a PR cannot switch off its own checks.
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      on: ${{ steps.s.outputs.on }}
      runner: ${{ steps.s.outputs.runner }}
    steps:
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.base.sha || github.sha }}
          # true for a PR from a fork: its code never runs on a self-hosted runner.
          FORK: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          gh api "repos/$REPO/contents/.github/cicd/config?ref=$REF" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/config" || true
          conf() { sed -n "s/^$1=//p" "$RUNNER_TEMP/config" | tail -1 | tr -d '"'; }
          if [ "$(conf CI_ENABLED)" = "false" ]; then
            echo "CI_ENABLED is false in .github/cicd/config; nothing runs"; printf 'on=false\nrunner="ubuntu-24.04"\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Where the other jobs run: a runner label, or a JSON list of labels
          # for a self-hosted runner. This job itself stays hosted, so a dead
          # runner cannot stop it deciding. A fork PR always runs hosted.
          runner() {  # runner <KEY>: the runs-on value, as JSON for fromJSON
            local x j
            x=$(sed -n "s/^$1=//p" "$RUNNER_TEMP/config" | tail -1)  # raw: a JSON list keeps its quotes
            case "$x" in
              "") j='"ubuntu-24.04"' ;;
              \[*) j=$(jq -ce 'select(type == "array" and length > 0 and all(.[]; type == "string" and test("^[A-Za-z0-9._-]+$")))' <<<"$x" 2>/dev/null) || j= ;;
              *) x=$(tr -d '"' <<<"$x"); if [[ $x =~ ^[A-Za-z0-9._-]+$ ]]; then j=$(jq -nc --arg l "$x" '$l'); else j=; fi ;;
            esac
            if [ -z "$j" ]; then echo "::error::$1 must be a runner label or a JSON list of labels, not '$x'" >&2; return 1; fi
            if [ "$FORK" = true ] && [ "$j" != '"ubuntu-24.04"' ]; then
              echo "::notice::A PR from a fork runs on ubuntu-24.04, whatever $1 says" >&2; j='"ubuntu-24.04"'
            fi
            echo "$j"
          }
          r=$(runner CI_RUNNER) || { echo 'runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"; exit 1; }
          echo "runner=$r" >> "$GITHUB_OUTPUT"
          echo "on=true" >> "$GITHUB_OUTPUT"

  lint:
    needs: switch
    if: needs.switch.outputs.on == 'true'
    runs-on: ${{ fromJSON(needs.switch.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            lab/hvfixture/go.sum
      # make lint runs golangci-lint from ~/go/bin, and skips it when it is not there.
      - name: Install golangci-lint
        run: GOBIN="$HOME/go/bin" go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_LINT_VERSION"
      - run: make lint
      - run: make lab-test

  docs:
    needs: switch
    if: needs.switch.outputs.on == 'true'
    runs-on: ${{ fromJSON(needs.switch.outputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make docs
      - name: Generated files are up to date
        run: |
          if ! git diff --exit-code --stat; then
            echo "::error::make docs changed the files above; run it and commit the result"
            exit 1
          fi

  e2e:
    needs: switch
    if: needs.switch.outputs.on == 'true'
    runs-on: ${{ fromJSON(needs.switch.outputs.runner) }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            lab/hvfixture/go.sum
      - run: make e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e2e-fixture-results
          path: docs/test-results/fixture/
          if-no-files-found: ignore

  evals:
    needs: switch
    if: needs.switch.outputs.on == 'true'
    runs-on: ${{ fromJSON(needs.switch.outputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            lab/hvfixture/go.sum
      - run: make evals

  govulncheck:
    needs: switch
    if: needs.switch.outputs.on == 'true'
    runs-on: ${{ fromJSON(needs.switch.outputs.runner) }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [".", lab/hvfixture]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            lab/hvfixture/go.sum
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: go run "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION" ./...

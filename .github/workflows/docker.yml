# Vendored from https://github.com/omerfsen/cicd (github/pipelines/docker/); edit it
# there and re-run its install.sh. Settings for THIS repo live in
# .github/cicd/config, which install.sh never overwrites.
#
# docker - builds one container image (or several, see DOCKER_IMAGES), scans
# each, and publishes them.
#   - Pull request / manual run: trivy dependency scan of the build context,
#     then build (loaded, never pushed) and a trivy scan of the image. Severities
#     in DOCKER_SCAN_SEVERITY fail it.
#   - Push to main or a vX.Y.Z tag: build, scan, and only when the scan passes,
#     push to DOCKER_REGISTRY and sign keyless with cosign. Runs in the
#     DOCKER_ENVIRONMENT environment. Tags: .github/cicd/docker/image.sh.
#   - DOCKER_IMAGES (a JSON list) builds several images from one repo, e.g.
#     several targets of one Dockerfile; each runs as its own matrix entry with
#     the same scan, push, signature and attestations. Unset: one image, as before.
#   - DOCKER_PLATFORMS (e.g. linux/amd64,linux/arm64) publishes one multi-platform
#     image per entry. The runner's own platform is scanned before the push as
#     always; every listed platform is scanned again from the registry after the
#     push and BEFORE signing, so an image that fails it stays unsigned. Unset:
#     the runner's platform only, as before.
#   - DOCKER_PATHS_IGNORE (e.g. docs/*,scripts/*,*.md): a PR or push to main
#     that changes only matching files builds nothing. Tags always build.
# Logins: ghcr.io with GITHUB_TOKEN (packages: write), Azure Container Registry
# with OIDC, both keyless. Docker Hub has no keyless login: it takes the variable
# DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN from the DOCKER_ENVIRONMENT
# environment, so only the push job on main or a release tag can read them.
#
# Kill switch: DOCKER_ENABLED=false in .github/cicd/config.
name: docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs.
permissions: {}

# Trivy sends anonymous usage data unless told not to; this covers trivy-action and
# the trivy CLI alike.
env:
  TRIVY_DISABLE_TELEMETRY: "true"

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reads this repo's settings from the BASE of a PR (or the pushed commit),
  # never from the PR's own head, so a PR cannot switch off its own checks or
  # change the settings it is checked with.
  switch:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read  # the changed files, for DOCKER_PATHS_IGNORE
    outputs:
      on: ${{ steps.s.outputs.on }}
      runner: ${{ steps.s.outputs.runner }}
      images: ${{ steps.s.outputs.images }}
      multi: ${{ steps.s.outputs.multi }}
      registry: ${{ steps.s.outputs.registry }}
      scan_severity: ${{ steps.s.outputs.scan_severity }}
      scan_exit: ${{ steps.s.outputs.scan_exit }}
      sign: ${{ steps.s.outputs.sign }}
      attest: ${{ steps.s.outputs.attest }}
      cache: ${{ steps.s.outputs.cache }}
      platforms: ${{ steps.s.outputs.platforms }}
      environment: ${{ steps.s.outputs.environment }}
      azure_tenant_id: ${{ steps.s.outputs.azure_tenant_id }}
      azure_subscription_id: ${{ steps.s.outputs.azure_subscription_id }}
      azure_client_id: ${{ steps.s.outputs.azure_client_id }}
    steps:
      - id: s
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.base.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          # true for a PR from a fork: its code never runs on a self-hosted runner.
          FORK: ${{ github.event.pull_request.head.repo.full_name != '' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          gh api "repos/$REPO/contents/.github/cicd/config?ref=$REF" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/config" || true
          conf() { sed -n "s/^$1=//p" "$RUNNER_TEMP/config" | tail -1 | tr -d '"'; }
          if [ "$(conf DOCKER_ENABLED)" = "false" ]; then
            echo "DOCKER_ENABLED is false in .github/cicd/config; nothing runs"; printf 'on=false\nrunner="ubuntu-24.04"\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Where the other jobs run: a runner label, or a JSON list of labels
          # for a self-hosted runner. This job itself stays hosted, so a dead
          # runner cannot stop it deciding. A fork PR always runs hosted.
          runner() {  # runner <KEY>: the runs-on value, as JSON for fromJSON
            local x j
            x=$(sed -n "s/^$1=//p" "$RUNNER_TEMP/config" | tail -1)  # raw: a JSON list keeps its quotes
            case "$x" in
              "") j='"ubuntu-24.04"' ;;
              \[*) j=$(jq -ce 'select(type == "array" and length > 0 and all(.[]; type == "string" and test("^[A-Za-z0-9._-]+$")))' <<<"$x" 2>/dev/null) || j= ;;
              *) x=$(tr -d '"' <<<"$x"); if [[ $x =~ ^[A-Za-z0-9._-]+$ ]]; then j=$(jq -nc --arg l "$x" '$l'); else j=; fi ;;
            esac
            if [ -z "$j" ]; then echo "::error::$1 must be a runner label or a JSON list of labels, not '$x'" >&2; return 1; fi
            if [ "$FORK" = true ] && [ "$j" != '"ubuntu-24.04"' ]; then
              echo "::notice::A PR from a fork runs on ubuntu-24.04, whatever $1 says" >&2; j='"ubuntu-24.04"'
            fi
            echo "$j"
          }
          r=$(runner DOCKER_RUNNER) || { echo 'runner="ubuntu-24.04"' >> "$GITHUB_OUTPUT"; exit 1; }
          echo "runner=$r" >> "$GITHUB_OUTPUT"
          v() { local x; x=$(conf "$1"); echo "${x:-$2}"; }
          bool() {  # bool <KEY> <default>: anything but true/false stops the run
            local x; x=$(v "$1" "$2")
            case "$x" in true|false) echo "$x" ;; *) echo "::error::$1 must be true or false, not '$x'" >&2; return 1 ;; esac
          }
          image=$(v DOCKER_IMAGE "${REPO#*/}"); image=${image,,}
          registry=$(v DOCKER_REGISTRY "ghcr.io/${REPO%%/*}"); registry=${registry,,}
          # The images to build: DOCKER_IMAGES (raw, a JSON list keeps its
          # quotes), else the one image from DOCKER_IMAGE/CONTEXT/FILE. The
          # helper is read from the same base commit as the config. A base that
          # still has the older helper (the PR that updates the pipeline)
          # builds the one image, as before.
          list=$(sed -n "s/^DOCKER_IMAGES=//p" "$RUNNER_TEMP/config" | tail -1)
          gh api "repos/$REPO/contents/.github/cicd/docker/image.sh?ref=$REF" --jq .content 2>/dev/null | base64 -d > "$RUNNER_TEMP/image.sh" || true
          if grep -q '^images()' "$RUNNER_TEMP/image.sh"; then
            images=$(bash "$RUNNER_TEMP/image.sh" images "$image" "$(v DOCKER_CONTEXT .)" "$(v DOCKER_FILE Dockerfile)" <<<"$list") \
              || { echo "::error::DOCKER_IMAGES is not valid, see above"; exit 1; }
          else
            [ -z "$list" ] || echo "::warning::DOCKER_IMAGES is ignored until the updated docker pipeline is on the base branch"
            list=
            images=$(jq -nc --arg i "$image" --arg c "$(v DOCKER_CONTEXT .)" --arg f "$(v DOCKER_FILE Dockerfile)" \
              '[{id: ($i | gsub("[^a-z0-9]+"; "-")), image: $i, context: $c, file: $f, target: ""}]')
          fi
          # DOCKER_PLATFORMS, checked by the same base-commit helper; an older
          # helper builds the runner's platform only.
          plats=$(sed -n "s/^DOCKER_PLATFORMS=//p" "$RUNNER_TEMP/config" | tail -1)
          if grep -q '^platforms()' "$RUNNER_TEMP/image.sh"; then
            platforms=$(bash "$RUNNER_TEMP/image.sh" platforms <<<"$plats") \
              || { echo "::error::DOCKER_PLATFORMS is not valid, see above"; exit 1; }
          else
            [ -z "$plats" ] || echo "::warning::DOCKER_PLATFORMS is ignored until the updated docker pipeline is on the base branch"
            platforms=
          fi
          # DOCKER_PATHS_IGNORE: a PR, or a push to main, that changes only files
          # matching these patterns builds nothing (the jobs show as skipped).
          # Tags and manual runs always build. Any doubt (no file list, a list
          # GitHub cut short, a base with the older helper) builds as before.
          skip=false
          ign=$(conf DOCKER_PATHS_IGNORE)
          if [ -n "$ign" ] && grep -q '^ignored()' "$RUNNER_TEMP/image.sh"; then
            files=
            if [ "$EVENT" = pull_request ] && [[ $PR =~ ^[0-9]+$ ]]; then
              files=$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename') || files=
            elif [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ] && [[ $BEFORE =~ ^[0-9a-f]{40}$ ]] && [[ $BEFORE =~ [1-9a-f] ]]; then
              files=$(gh api "repos/$REPO/compare/$BEFORE...$GITHUB_SHA" --jq 'if (.files | length) < 300 then .files[].filename else empty end') || files=
            fi
            if [ -n "$files" ] && bash "$RUNNER_TEMP/image.sh" ignored "$ign" <<<"$files"; then
              skip=true
              echo "::notice::Only files matching DOCKER_PATHS_IGNORE changed; nothing is built"
            fi
          fi
          blocks=$(bool DOCKER_SCAN_BLOCKS true) || exit 1
          sign=$(bool DOCKER_SIGN true) || exit 1
          attest=$(bool DOCKER_ATTEST true) || exit 1
          cache=$(bool DOCKER_CACHE true) || exit 1
          {
            echo "on=$([ "$skip" = true ] && echo false || echo true)"
            echo "images=$images"
            echo "multi=$([ -n "${list//[[:space:]]/}" ] && echo true || echo false)"
            echo "registry=$registry"
            echo "scan_severity=$(v DOCKER_SCAN_SEVERITY CRITICAL,HIGH)"
            echo "scan_exit=$([ "$blocks" = true ] && echo 1 || echo 0)"
            echo "sign=$sign"
            echo "attest=$attest"
            echo "cache=$cache"
            echo "platforms=$platforms"
            echo "environment=$(v DOCKER_ENVIRONMENT registry)"
            echo "azure_tenant_id=$(v DOCKER_AZURE_TENANT_ID '')"
            echo "azure_subscription_id=$(v DOCKER_AZURE_SUBSCRIPTION_ID '')"
            echo "azure_client_id=$(v DOCKER_AZURE_CLIENT_ID '')"
          } >> "$GITHUB_OUTPUT"

  # Build and scan, no credential: PRs (forks too) and manual runs. One matrix
  # entry per image; one failing entry fails the run, the others still finish.
  build:
    needs: switch
    if: needs.switch.outputs.on == 'true' && github.event_name != 'push'
    # Unchanged check name ("build") when there is one image.
    name: ${{ needs.switch.outputs.multi == 'true' && format('build ({0})', matrix.image) || 'build' }}
    runs-on: ${{ fromJSON(needs.switch.outputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.switch.outputs.images) }}
    env:
      CONTEXT: ${{ matrix.context }}
      SEVERITY: ${{ needs.switch.outputs.scan_severity }}
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads lockfiles, so it reports a vulnerable dependency even when the
      # image does not ship it.
      - name: Dependency scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.context }}
          scanners: vuln
          severity: ${{ needs.switch.outputs.scan_severity }}
          ignore-unfixed: true
          exit-code: ${{ needs.switch.outputs.scan_exit }}
          format: table
          output: dependency-scan.txt
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: scan-target-${{ matrix.id }}:${{ github.sha }}
          no-cache: ${{ needs.switch.outputs.cache != 'true' }}
          cache-from: ${{ needs.switch.outputs.cache == 'true' && format('type=gha,scope={0}', matrix.id) || '' }}
          cache-to: ${{ needs.switch.outputs.cache == 'true' && format('type=gha,mode=max,scope={0}', matrix.id) || '' }}
      # Every listed platform must build; only the runner's own is loaded and
      # scanned here, the publish job scans them all.
      - name: Set up QEMU
        if: needs.switch.outputs.platforms != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Build every platform
        if: needs.switch.outputs.platforms != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ needs.switch.outputs.platforms }}
          push: false
          outputs: type=cacheonly
          no-cache: ${{ needs.switch.outputs.cache != 'true' }}
          cache-from: ${{ needs.switch.outputs.cache == 'true' && format('type=gha,scope={0}', matrix.id) || '' }}
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target-${{ matrix.id }}:${{ github.sha }}
          severity: ${{ needs.switch.outputs.scan_severity }}
          ignore-unfixed: true
          exit-code: ${{ needs.switch.outputs.scan_exit }}
          format: table
          output: image-scan.txt
      - name: Report
        if: always()
        run: |
          for f in dependency-scan image-scan; do
            echo "### $IMAGE_NAME: $f ($SEVERITY)"
            if [ -s "$f.txt" ]; then echo '```'; head -c 30000 "$f.txt"; echo '```'; else echo "Nothing at these severities."; fi
          done >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: scans-${{ matrix.id }}
          path: "*-scan.txt"
          retention-days: 30

  # Main or a release tag only. Build, scan, and push only what passed: a scan
  # after the push would leave an unscanned image pullable.
  publish:
    needs: switch
    if: >-
      needs.switch.outputs.on == 'true' && github.event_name == 'push'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    name: ${{ needs.switch.outputs.multi == 'true' && format('publish ({0})', matrix.image) || 'publish' }}
    environment: ${{ needs.switch.outputs.environment }}
    runs-on: ${{ fromJSON(needs.switch.outputs.runner) }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.switch.outputs.images) }}
    permissions:
      contents: read
      packages: write # ghcr.io push with GITHUB_TOKEN
      id-token: write # Azure OIDC and cosign keyless signing
      attestations: write # build provenance
    env:
      IMAGE: ${{ needs.switch.outputs.registry }}/${{ matrix.image }}
      # GitHub's attestation store refuses private repos owned by a user;
      # those get the provenance as a cosign attestation in the registry.
      PRIVATE: ${{ github.event.repository.private }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
      REGISTRY: ${{ needs.switch.outputs.registry }}
      SIGN: ${{ needs.switch.outputs.sign }}
      ATTEST: ${{ needs.switch.outputs.attest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tags and login
        id: meta
        run: |
          set -euo pipefail
          mapfile -t tags < <(bash .github/cicd/docker/image.sh tags "$GITHUB_REF" "$GITHUB_SHA")
          [ ${#tags[@]} -gt 0 ] || { echo "::error::$GITHUB_REF does not publish"; exit 1; }
          read -r kind acr < <(bash .github/cicd/docker/image.sh login "$REGISTRY")
          # Docker logs in to Hub under index.docker.io, and the provenance push looks
          # up its credentials by that host.
          subject=$IMAGE
          [ "$kind" != dockerhub ] || subject=index.docker.io/${IMAGE#docker.io/}
          prov=$(bash .github/cicd/docker/image.sh provenance-mode "$PRIVATE" "$OWNER_TYPE")
          refs=$(printf "$IMAGE:%s," "${tags[@]}")
          { echo "tags=${tags[*]}"; echo "refs=${refs%,}"; echo "kind=$kind"; echo "acr=${acr:-}"; echo "subject=$subject"; echo "prov=$prov"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file }}
          target: ${{ matrix.target }}
          load: true
          push: false
          tags: scan-target-${{ matrix.id }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          no-cache: ${{ needs.switch.outputs.cache != 'true' }}
          cache-from: ${{ needs.switch.outputs.cache == 'true' && format('type=gha,scope={0}', matrix.id) || '' }}
          cache-to: ${{ needs.switch.outputs.cache == 'true' && format('type=gha,mode=max,scope={0}', matrix.id) || '' }}
      - name: Image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target-${{ matrix.id }}:${{ github.sha }}
          severity: ${{ needs.switch.outputs.scan_severity }}
          ignore-unfixed: true
          exit-code: ${{ needs.switch.outputs.scan_exit }}
          format: table
          output: image-scan.txt
      - name: Log in to ghcr.io
        if: steps.meta.outputs.kind == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        if: steps.meta.outputs.kind == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Shared with the other pipelines: .github/cicd/actions/azure-login.
      - name: Log in to Azure and the registry
        if: steps.meta.outputs.kind == 'acr'
        uses: ./.github/cicd/actions/azure-login
        with:
          client-id: ${{ needs.switch.outputs.azure_client_id }}
          tenant-id: ${{ needs.switch.outputs.azure_tenant_id }}
          subscription-id: ${{ needs.switch.outputs.azure_subscription_id }}
          acr: ${{ steps.meta.outputs.acr }}
      - name: Push
        id: push
        if: needs.switch.outputs.platforms == ''
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SCAN_TARGET: scan-target-${{ matrix.id }}
        run: |
          set -euo pipefail
          for t in $TAGS; do
            docker tag "$SCAN_TARGET:$GITHUB_SHA" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          # The digest is the one reference that cannot move; deploy by it.
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:${TAGS%% *}" | cut -d@ -f2)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Multi-platform: one image index for all platforms, pushed under the same
      # tags. The runner's own platform comes from the cache of the scanned build.
      - name: Set up QEMU
        if: needs.switch.outputs.platforms != ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Push every platform
        id: pushmulti
        if: needs.switch.outputs.platforms != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ needs.switch.outputs.platforms }}
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.refs }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          no-cache: ${{ needs.switch.outputs.cache != 'true' }}
          cache-from: ${{ needs.switch.outputs.cache == 'true' && format('type=gha,scope={0}', matrix.id) || '' }}
          cache-to: ${{ needs.switch.outputs.cache == 'true' && format('type=gha,mode=max,scope={0}', matrix.id) || '' }}
      - name: Digest
        id: digest
        env:
          DIGEST: ${{ steps.push.outputs.digest || steps.pushmulti.outputs.digest }}
        run: |
          [[ $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest from the push: '$DIGEST'"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      # Each platform as pushed, before anything signs it: a failure here leaves
      # the image unsigned, so a verified pull refuses it.
      - name: Scan every platform
        if: needs.switch.outputs.platforms != ''
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
          PLATFORMS: ${{ needs.switch.outputs.platforms }}
          SEVERITY: ${{ needs.switch.outputs.scan_severity }}
          EXIT: ${{ needs.switch.outputs.scan_exit }}
        run: |
          set -uo pipefail
          command -v trivy >/dev/null || { echo "::error::trivy is not on PATH"; exit 1; }
          rc=0
          for p in ${PLATFORMS//,/ }; do
            echo "== $p" >> platform-scan.txt
            trivy image --quiet --platform "$p" --severity "$SEVERITY" --ignore-unfixed \
              --exit-code "$EXIT" --format table "$IMAGE@$DIGEST" >> platform-scan.txt 2>&1 || rc=1
          done
          cat platform-scan.txt
          exit $rc
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: needs.switch.outputs.sign == 'true' || needs.switch.outputs.attest == 'true'
      # Keyless: the signature is bound to this workflow's OIDC identity and
      # logged in the public Rekor transparency log.
      - name: Sign
        if: needs.switch.outputs.sign == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      # What is in the image and how it was built, attached to the digest.
      - name: SBOM
        if: needs.switch.outputs.attest == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target-${{ matrix.id }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          scanners: vuln
      - name: Attest the SBOM
        if: needs.switch.outputs.attest == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"
      # Provenance never fails a publish that already pushed and signed: a
      # failure here shows in the summary as a warning.
      - name: Attest the build provenance
        id: prov_github
        if: needs.switch.outputs.attest == 'true' && steps.meta.outputs.prov == 'github'
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.subject }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
      - name: Attest the build provenance (cosign)
        id: prov_cosign
        if: needs.switch.outputs.attest == 'true' && steps.meta.outputs.prov == 'cosign'
        continue-on-error: true
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          bash .github/cicd/docker/image.sh provenance > provenance.json
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$IMAGE@$DIGEST"
      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.digest.outputs.digest }}
          PROV: ${{ steps.meta.outputs.prov }}
          PLATFORMS: ${{ needs.switch.outputs.platforms }}
          PROV_OUTCOME: ${{ steps.meta.outputs.prov == 'cosign' && steps.prov_cosign.outcome || steps.prov_github.outcome }}
        run: |
          case "$ATTEST/$PROV_OUTCOME" in
            false/*) provline="off" ;;
            */success) provline="yes ($PROV)" ;;
            */failure) provline="FAILED ($PROV), the image is published without it"
              echo "::warning::Build provenance for $IMAGE failed ($PROV); the image is published and signed without it" ;;
            *) provline="not run" ;;
          esac
          {
            echo "### $IMAGE"
            echo "- tags: \`${TAGS:-none}\`"
            echo "- digest: \`${DIGEST:-not pushed}\`"
            echo "- platforms: \`${PLATFORMS:-runner only}\`"
            echo "- signed: \`$SIGN\`"
            echo "- provenance: $provline"
            for f in image-scan.txt platform-scan.txt; do
              if [ -s "$f" ]; then echo; echo '```'; head -c 30000 "$f"; echo '```'; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
